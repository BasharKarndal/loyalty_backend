version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: loyalty_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: loyalty_db

    ports:
      - "5433:5432"

    volumes:
      - loyalty_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d loyalty_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: loyalty_adminer
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8081:8080"

volumes:
  loyalty_postgres_data:
